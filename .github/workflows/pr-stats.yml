name: Update PR stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh counters
        env:
          GH_TOKEN: ${{ secrets.PR_STATS_TOKEN }}
          ARCHIVED_ORGS: ${{ secrets.ARCHIVED_ORGS }}
        run: python3 scripts/pr_stats.py "${{ github.repository_owner }}" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update PR stats" && git push)
